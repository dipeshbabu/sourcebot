name: Verify functional bug fixes before PRs

on:
  push:
    branches: [dipeshbabu/verify-functional-bugs]

permissions:
  contents: read

jobs:
  application:
    name: Test and lint (${{ matrix.issue }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - issue: 1681
            ref: 5fd82986d55b6e4f56fc67291609288ebe2935d6
          - issue: 131
            ref: 0bb329bb4c009807eb2fc2ec8d7c1beea62c3ffa
          - issue: 1387
            ref: b0298926f7b2e1ea8a41bb10f8c84c0a01156a44
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          submodules: true
      - name: Record tested commit
        run: git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Test
        run: yarn workspaces foreach --all --topological --exclude setup-sourcebot --exclude 'root-workspace-*' run test
      - name: Lint
        if: ${{ !cancelled() }}
        run: yarn lint
      - name: Test vulnerability automation
        if: ${{ !cancelled() }}
        run: |
          .github/scripts/test-vulnerability-triage.sh
          .github/scripts/test-cve-remediation.sh
          .github/scripts/testZoektSync.sh
          .github/scripts/test-entrypoint-install-id.sh

  build:
    name: PR Gate (${{ matrix.issue }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - issue: 1681
            ref: 5fd82986d55b6e4f56fc67291609288ebe2935d6
          - issue: 131
            ref: 0bb329bb4c009807eb2fc2ec8d7c1beea62c3ffa
          - issue: 1387
            ref: b0298926f7b2e1ea8a41bb10f8c84c0a01156a44
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          submodules: true
          fetch-depth: 0
      - name: Record tested commit
        run: git rev-parse HEAD
      - name: Check Prisma migrations
        uses: ./.github/actions/check-prisma-migrations
        with:
          base-ref: main
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .

  regressions:
    name: Prove regression (${{ matrix.issue }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - issue: 1681
            ref: 5fd82986d55b6e4f56fc67291609288ebe2935d6
            source: packages/web/src/features/search/zoektSearcher.ts
            test: zoektSearcher.test.ts
          - issue: 1387
            ref: b0298926f7b2e1ea8a41bb10f8c84c0a01156a44
            source: packages/web/src/app/(app)/browse/components/fileSearchCommandDialog.tsx
            test: fileSearchCommandDialog.test.tsx
          - issue: 131
            ref: 0bb329bb4c009807eb2fc2ec8d7c1beea62c3ffa
            source: packages/web/src/app/(app)/search/components/filterPanel/filter.tsx
            test: filter.test.tsx
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          submodules: true
      - name: Record tested commit
        run: git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Regression tests pass with the fix
        run: yarn workspace @sourcebot/web test --run '${{ matrix.test }}'
      - name: Regression tests reject the original implementation
        run: |
          git restore --source=b4931510050233e940992773468afd4252ebc89f -- '${{ matrix.source }}'
          if yarn workspace @sourcebot/web test --run '${{ matrix.test }}' > "$RUNNER_TEMP/regression.log" 2>&1; then
            cat "$RUNNER_TEMP/regression.log"
            echo 'Regression tests unexpectedly passed without the fix.'
            exit 1
          fi
          cat "$RUNNER_TEMP/regression.log"
